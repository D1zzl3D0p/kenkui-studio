[package]
name = "tauri-plugin-mobile-export"
version = "0.1.0"
authors = [ "Kenkui contributors" ]
description = "Private native audiobook export bridge for Kenkui Studio"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-export"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
