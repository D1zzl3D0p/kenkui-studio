[package]
name = "kenkui-studio"
version = "10.0.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["native-shell"]
native-shell = ["dep:tauri-build", "dep:tauri", "dep:tauri-plugin-os", "dep:tauri-plugin-store", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-opener", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-mobile-export"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "net", "io-util", "time", "rt-multi-thread"] }
futures-util = "0.3"
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
tauri-plugin-mobile-export = { path = "plugins/mobile-export", optional = true }
tauri-plugin-os = { version = "2.3.2", optional = true }
tauri-plugin-store = { version = "2.4.4", optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
tauri-plugin-fs = { version = "2.5.2", optional = true }
tauri-plugin-opener = { version = "2.5.5", optional = true }
tauri-plugin-notification = { version = "2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tauri-plugin-single-instance = { version = "2", optional = true }

[[bin]]
name = "kenkui-studio"
path = "src/main.rs"
required-features = ["native-shell"]

[lib]
name = "kenkui_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]
