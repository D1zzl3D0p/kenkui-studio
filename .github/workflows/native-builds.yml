name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep these versions aligned with mise.toml.
  RUST_VERSION: 1.98.1
  NODE_VERSION: 24.21.0

jobs:
  checks:
    name: Frontend and Rust core checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: core-tests
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run build:web
      - run: npm run build:native
      - run: npm run test:native

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - name: macos-x64
            runner: macos-14
            target: x86_64-apple-darwin
            bundles: app
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - run: npm ci
      - name: Ad-hoc sign macOS test builds
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Build application and packages
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Archive macOS application preserving permissions and symlinks
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/$BUILD_TARGET/release/bundle/macos/Kenkui Studio.app" \
            "src-tauri/target/$BUILD_TARGET/release/bundle/Kenkui-Studio.app.zip"
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: kenkui-studio-${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/*.app.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK (ARM64 and x64)
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-debug
      - run: npm ci
      - run: npm run mobile:doctor -- android
      - name: Build installable debug APK
        run: npm run android:build -- --ci --debug --apk --target aarch64 x86_64 -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: kenkui-studio-android-debug-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator (ARM64)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-simulator
      - name: Ensure Apple project tools are available
        run: |
          command -v pod || brew install cocoapods
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
      - run: npm ci
      - name: Generate iOS project if not checked in
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npm run ios:init -- --ci --skip-targets-install
          fi
      - name: Build simulator application without distribution signing
        run: npm run ios:build -- --ci --debug --target aarch64-sim --no-sign -- --locked
      - name: Archive simulator application
        run: |
          app=$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)
          test -n "$app"
          platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")
          test "$platform" = iPhoneSimulator
          ditto -c -k --sequesterRsrc --keepParent "$app" Kenkui-Studio-ios-simulator.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kenkui-studio-ios-simulator-arm64-${{ github.sha }}
          path: Kenkui-Studio-ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 14
